<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow-sm">
        <div class="card-body">

          <h4 class="text-center mb-3">Iniciar sesión</h4>

          <!-- Formulario principal con data-modulo -->
          <form id="form-login" data-modulo="login">

            <!-- Campo usuario -->
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input 
                type="text"
                name="usuario"
                class="form-control"
                placeholder="usuario"
                data-modulo="login"
                data-accion="cambio"
                data-campo="usuario"
                required
              >
            </div>

            <!-- Campo contraseña -->
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input 
                type="password"
                class="form-control"
                placeholder="••••••••"
                name="password"
                data-modulo="login"
                data-accion="cambio"
                data-campo="password"
                required
              >
            </div>

            <!-- Botón de envío con tipo 'submit' y data-accion -->
            <button 
              type="button"
              class="btn btn-primary w-100"
              data-modulo="login"
                data-accion="enviar"
            >
              Entrar
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
