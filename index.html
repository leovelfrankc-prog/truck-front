<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truckero PWA</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos.css?v=20260929">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- BANNER OPCIONAL PARA PROMOVER INSTALACIÓN PWA -->
  <div id="bannerInstalacion" class="alert alert-info alert-dismissible fade show d-none m-0 rounded-0" role="alert">
    <strong>¡Instala Truckero!</strong> Agrégala a tu pantalla de inicio para un acceso rápido.
    <button id="btnInstalarPWA" class="btn btn-sm btn-primary ms-3">Instalar</button>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- HEADER / MENÚ DINÁMICO -->
  <header id="headerApp" class="bg-primary text-white p-2 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h5 m-0">Truckero</h1>
      <nav id="menuRolesSecundarios" class="d-flex gap-2">
        <!-- Renders dinámicos de botones/menú cuando se necesite -->
      </nav>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE VISTAS (APP SHELL) -->
  <main id="vistas" class="flex-grow-1 container py-3">
    
    <!-- ÁREA PARA MENSAJES Y NOTIFICACIONES DE PANTALLA -->
    <div id="zonaMensajes"></div>

    <!-- ÁREA PARA EXPOSICIÓN DE TABLAS, FORMULARIOS Y TARJETAS -->
    <div id="contenidoDinamico">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando aplicación...</p>
      </div>
    </div>

  </main>

  <!-- MODAL UNIVERSAL -->
  <div class="modal fade" id="modalUniversal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content" id="modalUniversalContenido">
        <!-- Formulario o tabla modal inyectada aquí -->
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="footerApp" class="bg-light text-center py-2 border-top text-muted small mt-auto">
    Truckero &copy; 2026
  </footer>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CAPAS DE ARQUITECTURA -->
  <script src="recursosHTML.js?v=20260929"></script>
  <script src="vistas.js?v=20260929"></script>
  <script src="transporter.js?v=20260929"></script>
  <script src="navigation.js?v=20260929"></script>
  <script src="actionEngine.js?v=20260929"></script>

  <!-- SCRIPT DE ARRANQUE E INSTALACIÓN PWA -->
  <script>
    window.APP_VERSION = "20260929";
    let deferredPrompt = null;

    // 1. CAPTURAR EVENTO DE INSTALACIÓN
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Mostrar el banner de instalación si no está instalada
      const banner = document.getElementById('bannerInstalacion');
      if (banner) banner.classList.remove('d-none');
    });

    document.getElementById('btnInstalarPWA')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('[PWA] Respuesta a instalación:', outcome);
        deferredPrompt = null;
        document.getElementById('bannerInstalacion').classList.add('d-none');
      }
    });

    // 2. INICIO DE APLICACIÓN
    document.addEventListener('DOMContentLoaded', async () => {
      // a. Procesar Token de la URL si existe
      const params = new URLSearchParams(window.location.search);
      const tokenUrl = params.get('token');

      if (tokenUrl) {
        localStorage.setItem('token', tokenUrl);
        window.TOKEN = tokenUrl;
        // Limpiar la URL para seguridad
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        window.TOKEN = localStorage.getItem('token');
      }

      // b. Registrar Service Worker
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register(`./sw.js?v=${window.APP_VERSION}`);
        } catch (err) {
          console.warn('[SW] Error al registrar:', err);
        }
      }

      // c. Iniciar la aplicación llamando a Apps Script vía Transporter
      Transporter.sendRequest('inicio', 'cargarVista');
    });
  </script>

</body>
</html>
