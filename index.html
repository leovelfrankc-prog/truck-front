<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Truckero</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <main id="vistas">
        <div>Cargando...</div>
    </main>

    <script src="utiles.js"></script>
    <script src="router.js"></script>
    <script src="controller.js"></script>
    <script src="listeners.js"></script>

    <script>
        function mostrarError(titulo, contenido) {
            const vistas = document.getElementById('vistas');
            vistas.innerHTML = `<div style='padding:20px;font-family:monospace;color:#b91c1c;white-space:pre-wrap;word-break:break-word;'>${titulo}\n\n${contenido}</div>`;
        }

        window.onerror = function(mensaje, archivo, linea, columna, error) {
            mostrarError('ERROR JAVASCRIPT', `Mensaje: ${mensaje}\n\nArchivo: ${archivo}\n\nLínea: ${linea}\n\nColumna: ${columna}\n\nStack:\n${error?.stack || 'No disponible'}`);
            return true;
        };

        window.addEventListener('unhandledrejection', event => {
            mostrarError('ERROR PROMESA', event.reason?.stack || JSON.stringify(event.reason, null, 2) || String(event.reason));
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');

                if (token) {
                    Session.setToken(token);
                    console.log('Token guardado');
                }

                if ('serviceWorker' in navigator) {
                    await navigator.serviceWorker.register('./sw.js');
                    console.log('Service Worker registrado');
                }

                const tokenFirmado = Session.getToken();
                document.getElementById('vistas').innerHTML = `<pre style='padding:15px;font-size:12px;white-space:pre-wrap;'>URL:\n${location.href}\n\nTOKEN URL:\n${token}\n\nTOKEN STORAGE:\n${tokenFirmado}</pre>`;

                await router('login', tokenFirmado);
            } catch (error) {
                mostrarError('ERROR INICIANDO TRUCKERO', error?.stack || error?.message || String(error));
            }
        });
    </script>
</body>
</html>
