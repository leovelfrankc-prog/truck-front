<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truckero</title>
<meta name="theme-color" content="#2563eb">
    <!-- Favicon tradicional (navegadores de escritorio) -->
<link rel="icon" href="favicon.ico" type="image/x-icon">

<!-- Icono formato WebP rápido -->
<link rel="icon" href="truckero-icon.webp" type="image/webp">

<!-- Icono para dispositivos Apple / PWA -->
<link rel="apple-touch-icon" href="truckero-icon-512x512.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<main id="vistas">
<div>Cargando...</div>
</main>
<script src="utiles.js"></script>
<script src="router.js"></script>
<script src="controller.js"></script>
<script src="listeners.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
try {
if ('serviceWorker' in navigator) {
await navigator.serviceWorker.register('./sw.js');
console.log('Service Worker registrado');
}
router('inicio');
} catch(error) {
console.error(error);
document.getElementById('vistas').innerHTML = 'Error iniciando Truckero';
}
});
</script>
</body>
</html>
