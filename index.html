<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d6efd" />
  <meta name="description" content="Aplicación web progresiva" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MiApp" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Estilos propios (opcional) -->
  <link rel="stylesheet" href="/css/styles.css" />

  <title>Mi App</title>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- ===================== BANNER OFFLINE ===================== -->
  <div id="offline-banner" class="alert alert-warning text-center rounded-0 mb-0 d-none" role="alert">
    <i class="bi bi-wifi-off me-2"></i>
    Estás sin conexión. Algunas funciones pueden no estar disponibles.
  </div>

  <!-- ===================== HEADER / NAVBAR ===================== -->
  <header id="app-header" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container-fluid">
      <!-- Logo / Título -->
      <a class="navbar-brand d-flex align-items-center" href="#" id="app-brand">
        <img src="/icons/icon-192.png" alt="Logo" width="32" height="32" class="me-2 d-none" id="app-logo" />
        <span id="app-title">Mi App</span>
      </a>

      <!-- Botón menú móvil -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#app-menu" aria-controls="app-menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Acciones rápidas del header (derecha) -->
      <div class="d-flex align-items-center gap-2 ms-auto" id="header-actions">
        <!-- Aquí el motor puede inyectar botones (usuario, notificaciones, etc.) -->
      </div>
    </div>
  </header>

  <!-- ===================== MENÚ LATERAL (OFFCANVAS) ===================== -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="app-menu" aria-labelledby="app-menu-label">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="app-menu-label">Menú</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body" id="menu-content">
      <!-- El motor renderiza aquí el menú dinámico -->
    </div>
  </div>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <main id="app" class="flex-grow-1 container-fluid py-3">

    <!-- Zona de mensajes / alertas persistentes -->
    <div id="messages" class="mb-3">
      <!-- Aquí se muestran alertas importantes (éxito, error, info) -->
    </div>

    <!-- Zona de tarjetas / resumen / dashboard -->
    <div id="cards" class="row g-3 mb-4">
      <!-- El motor puede inyectar tarjetas aquí -->
    </div>

    <!-- Zona principal de vistas (formularios, tablas, contenido) -->
    <div id="view-content">
      <!-- El motor renderiza aquí las orientaciones -->
    </div>

  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer id="app-footer" class="bg-light border-top py-3 mt-auto">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center small text-muted">
        <span id="footer-left">© 2026 Mi App</span>
        <span id="footer-right"></span>
      </div>
    </div>
  </footer>

  <!-- ===================== CONTENEDOR DE MODALES ===================== -->
  <div id="modals">
    <!-- El motor crea los modales aquí dinámicamente -->
  </div>

  <!-- ===================== CONTENEDOR DE TOASTS ===================== -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" style="z-index: 1100">
    <!-- Toasts generados por el motor -->
  </div>

  <!-- ===================== OVERLAY DE CARGA GLOBAL ===================== -->
  <div id="loading-overlay" class="position-fixed top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center"
       style="background: rgba(255,255,255,0.75); z-index: 2000;">
    <div class="text-center">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="mt-3 mb-0 fw-medium" id="loading-text">Cargando...</p>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error registrando SW:', err));
      });
    }
  </script>

  <!-- Motor + Aplicación -->
  <script type="module">
    import { inicio } from '/js/main.js';

    document.addEventListener('DOMContentLoaded', () => {
      inicio();
    });
  </script>

</body>
</html>
