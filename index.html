<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Genérica - HATEOAS Engine</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <div id="navbar-container"></div>
  <div id="offline-indicator" class="alert alert-danger py-1 px-3 shadow-sm mb-0" role="alert" style="display:none;">
    ⚠️ Trabajando sin conexión
  </div>
  <main class="container my-4 flex-grow-1" id="app-container">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-2">Cargando...</p>
    </div>
  </main>
  <div id="modal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- El index solo llama a inicio() -->
  <script type="module">
    import { inicio } from './js/engine.core.js';
    document.addEventListener('DOMContentLoaded', () => {
      inicio();
    });
  </script>
</body>
</html>
