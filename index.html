<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Truckero</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <main id="vistas">
        <div>Cargando...</div>
    </main>

    <script src="utiles.js"></script>
    <script src="router.js"></script>
    <script src="controller.js"></script>
    <script src="listeners.js"></script>

    <script>
        // Declaración global de la variable TOKEN
        window.TOKEN = null;

        function mostrarError(titulo, contenido) {
            const vistas = document.getElementById('vistas');
            vistas.innerHTML = `<div style='padding:20px;font-family:monospace;color:#b91c1c;white-space:pre-wrap;word-break:break-word;'>${titulo}\n\n${contenido}</div>`;
        }

        window.onerror = function(mensaje, archivo, linea, columna, error) {
            mostrarError('ERROR JAVASCRIPT', `Mensaje: ${mensaje}\n\nArchivo: ${archivo}\n\nLínea: ${linea}\n\nColumna: ${columna}\n\nStack:\n${error?.stack || 'No disponible'}`);
            return true;
        };

        window.addEventListener('unhandledrejection', event => {
            mostrarError('ERROR PROMESA', event.reason?.stack || JSON.stringify(event.reason, null, 2) || String(event.reason));
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Capturar el token desde la URL de forma síncrona
                const params = new URLSearchParams(window.location.search);
                const tokenUrl = params.get('token');

                // 2. Si viene un token en la URL, guardarlo inmediatamente en Session
                if (tokenUrl) {
                    Session.setToken(tokenUrl);
                    console.log('Token guardado desde URL');

                    // Limpiar la URL de la barra de direcciones para evitar fallos de PWA en iOS y Android
                    const cleanUrl = window.location.origin + window.location.pathname;
                    window.history.replaceState({}, document.title, cleanUrl);
                }

                // 3. Capturar/Actualizar la variable global TOKEN desde Session
                window.TOKEN = Session.getToken();

                // 4. Registrar Service Worker en segundo plano (SIN bloquear el flujo principal)
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(() => console.log('Service Worker registrado'))
                        .catch(err => console.warn('Error al registrar Service Worker:', err));
                }

                // 5. Panel de depuración visual para verificar estado en móvil
                document.getElementById('vistas').innerHTML = `<pre style='padding:15px;font-size:12px;white-space:pre-wrap;'>URL:\n${location.href}\n\nTOKEN URL:\n${tokenUrl}\n\nTOKEN GLOBAL (DOM):\n${TOKEN}</pre>`;

                // 6. Ejecutar router pasando la variable TOKEN
                await router('inicio');

            } catch (error) {
                mostrarError('ERROR INICIANDO TRUCKERO', error?.stack || error?.message || String(error));
            }
        });
    </script>
</body>
</html>
