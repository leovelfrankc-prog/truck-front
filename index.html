<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truckero</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  
  <!-- BOOTSTRAP CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos.css?v=20260929">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- HEADER / MENÚ DINÁMICO -->
  <header id="headerApp" class="bg-primary text-white p-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h5 m-0 fw-bold">Truckero</h1>
      <nav id="menuRolesSecundarios" class="d-flex gap-2">
        <!-- Renders dinámicos de botones cuando existan roles secundarios -->
      </nav>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL (APP SHELL) -->
  <main id="vistas" class="flex-grow-1 container my-3">
    
    <!-- ÁREA FIJA PARA NOTIFICACIONES Y ALERTAS DE PANTALLA -->
    <div id="zonaNotificaciones" class="mb-3"></div>

    <!-- ÁREA PARA EXPOSICIÓN DE VISTAS, TABLAS, FORMULARIOS Y TARJETAS -->
    <div id="contenidoDinamico">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando aplicación...</p>
      </div>
    </div>

  </main>

  <!-- MODAL UNIVERSAL CON SU ESTRUCTURA COMPLETA -->
  <div class="modal fade" id="modalUniversal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content" id="modalUniversalContenido">
        <!-- Formulario o tabla modal inyectada dinámicamente por RecursosHTML -->
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="footerApp" class="bg-white text-center py-2 border-top text-muted small mt-auto">
    Truckero &copy; 2026
  </footer>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CAPAS DE ARQUITECTURA (ORDEN ESTRICTO DE DEPENDENCIAS) -->
  <script src="recursosHTML.js?v=20260929"></script>
  <script src="vistas.js?v=20260929"></script>
  <script src="transporter.js?v=20260929"></script>
  <script src="navigation.js?v=20260929"></script>
  <script src="actionEngine.js?v=20260929"></script>

  <!-- ARRANQUE E INICIALIZACIÓN PWA -->
  <script>
    window.APP_VERSION = "20260929";

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. CAPTURAR Y GUARDAR TOKEN DE LA URL (SI VIENE DE UN LINK DE INVITACIÓN)
      const params = new URLSearchParams(window.location.search);
      const tokenUrl = params.get("token");

      if (tokenUrl) {
        localStorage.setItem("token", tokenUrl);
        window.TOKEN = tokenUrl;
        // Limpiar la URL para no exponer el token en la barra
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        window.TOKEN = localStorage.getItem("token");
      }

      // 2. REGISTRAR SERVICE WORKER CON LA VERSIÓN ACTUAL
      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register(`./sw.js?v=${window.APP_VERSION}`);
        } catch (err) {
          console.warn("[SW] Error al registrar:", err);
        }
      }

      // 3. EVALUAR ESTADO DE INSTALACIÓN
      const esPWAInstalada = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

      if (!esPWAInstalada && !window.TOKEN) {
        // Muestra la vista de instalación con el botón principal
        Vistas.renderModule({ moduleName: "inicioNoInstalada" });
      } else {
        // Si ya está instalada O tiene token, pide la vista activa a Apps Script
        Transporter.sendRequest("inicio", "cargarVista");
      }
    });
  </script>

</body>
</html>
