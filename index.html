<!-- ==========================================
     INICIALIZACIÓN DE TRUCKERO
     ========================================== -->

<script>

    /*
     * ==========================================
     * TOKEN GLOBAL
     * ==========================================
     */

    window.TOKEN = null;


    /*
     * ==========================================
     * MOSTRAR ERROR
     * ==========================================
     */

    function mostrarError(titulo, contenido) {

        const vistas =
            document.getElementById('vistas');

        if (!vistas) {
            return;
        }

        vistas.innerHTML = `
            <div
                style="
                    padding:20px;
                    font-family:monospace;
                    color:#b91c1c;
                    white-space:pre-wrap;
                    word-break:break-word;
                "
            >
                ${titulo}


${contenido}
</div>
`;
}

    /*
     * ==========================================
     * ERROR JAVASCRIPT GLOBAL
     * ==========================================
     */

    window.onerror = function(
        mensaje,
        archivo,
        linea,
        columna,
        error
    ) {

        mostrarError(
            'ERROR JAVASCRIPT',

            `Mensaje:


${mensaje}

Archivo:
${archivo}

Línea:
${linea}

Columna:
${columna}

Stack:
${error?.stack || 'No disponible'}`
);

        return true;
    };


    /*
     * ==========================================
     * PROMESAS NO CONTROLADAS
     * ==========================================
     */

    window.addEventListener(
        'unhandledrejection',
        event => {

            let detalle;

            try {

                detalle =
                    event.reason?.stack ||
                    JSON.stringify(
                        event.reason,
                        null,
                        2
                    ) ||
                    String(event.reason);

            } catch (error) {

                detalle =
                    String(event.reason);

            }

            mostrarError(
                'ERROR PROMESA',
                detalle
            );

        }
    );


    /*
     * ==========================================
     * SERVICE WORKER
     * ==========================================
     */

    async function registrarServiceWorker() {

        if (!('serviceWorker' in navigator)) {

            console.warn(
                '[SW] Service Worker no soportado'
            );

            return null;
        }


        try {

            const registro =
                await navigator.serviceWorker.register(
                    './sw.js?v=' +
                    window.APP_VERSION
                );


            console.log(
                '[SW] Registrado correctamente'
            );

            console.log(
                '[SW] Scope:',
                registro.scope
            );


            /*
             * Comprobar si existe una versión
             * nueva del Service Worker.
             */

            try {

                await registro.update();

                console.log(
                    '[SW] Comprobación de actualización realizada'
                );

            } catch (error) {

                console.warn(
                    '[SW] No se pudo comprobar actualización:',
                    error
                );

            }


            /*
             * Detectar nueva versión.
             */

            registro.addEventListener(
                'updatefound',
                () => {

                    console.log(
                        '[SW] Nueva versión detectada'
                    );

                    const nuevoSW =
                        registro.installing;

                    if (!nuevoSW) {
                        return;
                    }


                    nuevoSW.addEventListener(
                        'statechange',
                        () => {

                            console.log(
                                '[SW] Estado:',
                                nuevoSW.state
                            );


                            if (
                                nuevoSW.state ===
                                'activated'
                            ) {

                                console.log(
                                    '[SW] Nueva versión activada'
                                );

                            }

                        }
                    );

                }
            );


            /*
             * Información de diagnóstico.
             */

            if (registro.active) {

                registro.active.postMessage({
                    accion: 'PING'
                });

            }


            return registro;

        } catch (error) {

            console.warn(
                '[SW] Error registrando Service Worker:',
                error
            );

            return null;
        }
    }


    /*
     * ==========================================
     * RESPUESTAS DEL SERVICE WORKER
     * ==========================================
     */

    if ('serviceWorker' in navigator) {

        navigator.serviceWorker.addEventListener(
            'message',
            event => {

                console.log(
                    '[SW] Mensaje:',
                    event.data
                );

            }
        );

    }


    /*
     * ==========================================
     * INICIO DE LA APLICACIÓN
     * ==========================================
     */

    document.addEventListener(
        'DOMContentLoaded',
        async () => {

            try {

                console.log(
                    '====================================='
                );

                console.log(
                    '[TRUCKERO] INICIANDO APLICACIÓN'
                );

                console.log(
                    '[TRUCKERO] VERSION:',
                    window.APP_VERSION
                );

                console.log(
                    '[TRUCKERO] URL:',
                    window.location.href
                );


                /*
                 * ==================================
                 * 1. CAPTURAR TOKEN DE URL
                 * ==================================
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const tokenUrl =
                    params.get('token');


                /*
                 * ==================================
                 * 2. GUARDAR TOKEN
                 * ==================================
                 */

                if (tokenUrl) {

                    Session.setToken(
                        tokenUrl
                    );

                    console.log(
                        '[TRUCKERO] Token guardado desde URL'
                    );


                    /*
                     * Limpiar token de URL.
                     */

                    const cleanUrl =
                        window.location.origin +
                        window.location.pathname;

                    window.history.replaceState(
                        {},
                        document.title,
                        cleanUrl
                    );

                }


                /*
                 * ==================================
                 * 3. ACTUALIZAR TOKEN GLOBAL
                 * ==================================
                 */

                window.TOKEN =
                    Session.getToken();


                /*
                 * ==================================
                 * 4. REGISTRAR SERVICE WORKER
                 * ==================================
                 */

                await registrarServiceWorker();


                /*
                 * ==================================
                 * 5. INICIAR CONTROLADOR
                 * ==================================
                 */

                console.log(
                    '[TRUCKERO] Ejecutando controlador inicial...'
                );

                await controller(
                    'inicio',
                    'cargarVista'
                );


                console.log(
                    '[TRUCKERO] Aplicación iniciada'
                );

                console.log(
                    '====================================='
                );


            } catch (error) {

                console.error(
                    '[TRUCKERO] Error iniciando Truckero:',
                    error
                );

                mostrarError(
                    'ERROR INICIANDO TRUCKERO',
                    error?.stack ||
                    error?.message ||
                    String(error)
                );

            }

        }
    );

</script>
