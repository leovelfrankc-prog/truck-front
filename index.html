  <!-- VERSIÓN DE LA APLICACIÓN -->
  <script>
    window.APP_VERSION = "20260929";
  </script>

  <!-- BOOTSTRAP CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ESTILOS PROPIOS -->

</head> 
<body>

  <!-- HEADER -->
  <header id="headerApp">
    <nav id="menuRolesSecundarios">
      <!-- Aquí se insertan dinámicamente las opciones -->
    </nav>

  <!-- CONTENEDOR DE VISTAS -->
  <main id="vistas">
    <div>Cargando...</div>

  <!-- MODAL UNIVERSAL -->

      <div class="modal-content" id="modalUniversalContenido"></div>

  <!-- FOOTER -->
  <footer id="footerApp">
    Truckero
  </footer>

  <!-- BOOTSTRAP JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SCRIPTS PRINCIPALES -->
  <script src="utiles.js?v=20260929.2"></script>
  <script src="router.js?v=20260929.1"></script>
  <script src="controller.js?v=20260929.1"></script>

  <script src="moduloLogin.js?v=20260929"></script>

  <!-- UTILIDADES -->
  <script src="utilesModal.js?v=20260929"></script>

  <script src="utilesTablas.js?v=20260929"></script>

  <!-- INICIALIZACIÓN DE TRUCKERO -->
  <script>
    window.TOKEN = null;

    function mostrarError(titulo, contenido) {
      const vistas = document.getElementById('vistas');
      if (!vistas) return;

      vistas.innerHTML = `
        <div style="padding:20px; font-family:monospace; color:#b91c1c; white-space:pre-wrap; word-break:break-word;">
          ${titulo}\n\n${contenido}
        </div>`;
    }

    /* Manejo de Errores Globales */
window.onerror = function(mensaje, archivo, linea, columna, error) {

  console.log("[ONERROR]");
  console.log("mensaje:", mensaje);
  console.log("archivo:", archivo);
  console.log("linea:", linea);
  console.log("columna:", columna);
  console.log("error:", error);

  // IGNORAR los Script error genéricos de Safari
  if (mensaje === "Script error." && linea === 0) {
    console.warn("[SAFARI] Script error ignorado");
    return true;
  }

  mostrarError(
    'ERROR JAVASCRIPT',
    `Mensaje:\n${mensaje}\n\nArchivo:\n${archivo}\n\nLínea:\n${linea}\n\nColumna:\n${columna}\n\nStack:\n${error?.stack || 'No disponible'}`
  );

  return true;
};
    window.addEventListener('unhandledrejection', event => {
      let detalle;
      try {
        detalle = event.reason?.stack || JSON.stringify(event.reason, null, 2) || String(event.reason);
      } catch (e) {
        detalle = String(event.reason);
      }
      mostrarError('ERROR PROMESA', detalle);
    });

    /* Función Simplificada del Service Worker */
    async function registrarServiceWorker() {
      if (!('serviceWorker' in navigator)) return;

      try {
        const registro = await navigator.serviceWorker.register(`./sw.js?v=${window.APP_VERSION}`);
        console.log('[SW] Registrado en scope:', registro.scope);
        
        // Escuchar mensajes provenientes del Service Worker
        navigator.serviceWorker.addEventListener('message', e => console.log('[SW] Mensaje:', e.data));

        return registro;
      } catch (error) {
        console.warn('[SW] Error al registrar:', error);
      }
    }

    /* Inicio de la Aplicación */
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        console.log('=====================================');
        console.log('[TRUCKERO] INICIANDO APLICACIÓN');
        console.log('[TRUCKERO] VERSION:', window.APP_VERSION);

        // 1. Manejo del Token desde la URL
        const params = new URLSearchParams(window.location.search);
        const tokenUrl = params.get('token');

        if (tokenUrl) {
          Session.setToken(tokenUrl);
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }

        window.TOKEN = Session.getToken();
        window.url="https://script.google.com/macros/s/AKfycbx0WTI9ZLEC_ArJdkjYHplPSjXy3Xthc289eBaK894tC4ZREbrRaL_1IandKCaSYOZ85w/exec";
        // 2. Registrar Service Worker
        await registrarServiceWorker();

        // 3. Iniciar Controlador
        console.log('[TRUCKERO] Ejecutando controlador inicial...');
        await controller('inicio', 'cargarVista');

        console.log('[TRUCKERO] Aplicación iniciada');
        console.log('=====================================');

      } catch (error) {
        console.error('[TRUCKERO] Error iniciando:', error);
        mostrarError('ERROR INICIANDO TRUCKERO', error?.stack || error?.message || String(error));
      }
    });
  </script>

</body> 
</html>
