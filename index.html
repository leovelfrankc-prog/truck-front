<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Truckero</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- HEADER -->
    <header id="headerApp">
        <nav id="menuRolesSecundarios">
            <!-- Aquí se insertan dinámicamente las opciones -->
        </nav>
    </header>

    <!-- CONTENEDOR DE VISTAS -->
    <main id="vistas">
        <div>Cargando...</div>
    </main>

    <!-- FOOTER -->
    <footer id="footerApp">
        Truckero
    </footer>

    <!-- Scripts -->
    <script src="utiles.js"></script>
    <script src="router.js"></script>
    <script src="controller.js"></script>
    <script src="listeners.js"></script>
    <script src="js-login.gs"></script>
    <script src="js-empresa.js"></script>
    <script src="js-admin.js"></script>
    <script src="js-rh.js"></script>
    <script src="js-chofer.js"></script>
    <script>
        // Variable global del token
        window.TOKEN = null;

        function mostrarError(titulo, contenido) {
            const vistas = document.getElementById('vistas');
            vistas.innerHTML = `
                <div style="padding:20px;font-family:monospace;color:#b91c1c;white-space:pre-wrap;word-break:break-word;">
                    ${titulo}

${contenido}
                </div>`;
        }

        // Captura de errores globales
        window.onerror = function(mensaje, archivo, linea, columna, error) {
            mostrarError('ERROR JAVASCRIPT', 
                `Mensaje: ${mensaje}\n\nArchivo: ${archivo}\n\nLínea: ${linea}\n\nColumna: ${columna}\n\nStack:\n${error?.stack || 'No disponible'}`);
            return true;
        };

        window.addEventListener('unhandledrejection', event => {
            mostrarError('ERROR PROMESA', 
                event.reason?.stack || JSON.stringify(event.reason, null, 2) || String(event.reason));
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Capturar token de la URL
                const params = new URLSearchParams(window.location.search);
                const tokenUrl = params.get('token');

                // 2. Si existe token en URL → guardarlo y limpiar la barra de direcciones
                if (tokenUrl) {
                    Session.setToken(tokenUrl);
                    console.log('Token guardado desde URL');

                    const cleanUrl = window.location.origin + window.location.pathname;
                    window.history.replaceState({}, document.title, cleanUrl);
                }

                // 3. Actualizar variable global
                window.TOKEN = Session.getToken();

                // 4. Registrar Service Worker (no bloqueante)
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(() => console.log('Service Worker registrado'))
                        .catch(err => console.warn('Error al registrar Service Worker:', err));
                }

                // 5. (Opcional) Panel de depuración — descomenta solo si lo necesitas
                /*
                document.getElementById('vistas').innerHTML = `
                    <pre style="padding:15px;font-size:12px;white-space:pre-wrap;">
URL:
${location.href}

TOKEN URL:
${tokenUrl}

TOKEN GLOBAL:
${window.TOKEN}
                    </pre>`;
                */

                // 6. Iniciar la aplicación
                await controller("inicio", "cargarVista");

            } catch (error) {
                mostrarError('ERROR INICIANDO TRUCKERO', 
                    error?.stack || error?.message || String(error));
            }
        });
    </script>

</body>
</html>
