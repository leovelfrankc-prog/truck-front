<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truckero Front</title>

    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>Truckero Front</h1>
<h1>Truckero Front</h1> 

    <p>Frontend funcionando desde GitHub Pages.</p>

    <button onclick="probarFetch()">Probar fetch → doPost</button>

    <script>
        // Ajuste en el frontend (index.html)
async function probarFetch() {
  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbwQtcRhdQRXwxL9IXUtBoA2_VJfGsTRtB-dDO9NUoxv7ujK-4wKHexTiBmEaeQy2FUmZA/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8" // 👈 Agrega este encabezado
      },
      body: JSON.stringify({ mensaje: "Hola desde GitHub Pages" })
    });

    const json = await res.json();
    console.log(json);
    alert(JSON.stringify(json));
  } catch (error) {
    console.error("Error al conectar:", error);
  }
}
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
    </script>
</body>
</html>
